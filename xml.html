<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>XML Sitemap Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #f8fafc;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    .glass-panel {
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    textarea {
      resize: vertical;
    }
  </style>
</head>
<body class="p-4 md:p-8">

<div class="max-w-3xl mx-auto">
  <!-- Header -->
  <header class="mb-8 text-center">
    <h1 class="text-3xl font-bold text-slate-800">XML Sitemap Generator</h1>
    <p class="text-slate-600 mt-2">Paste one URL per line — get a ready-to-use sitemap.xml</p>
  </header>

  <!-- Input Card -->
  <div class="glass-panel p-6 rounded-2xl shadow-sm mb-6 border border-slate-200">
    <div class="flex flex-col gap-2 mb-4">
      <label class="font-semibold text-slate-700">URLs — one per line</label>
      <textarea id="url-input" rows="7"
        class="w-full p-4 border border-slate-300 rounded-xl shadow-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all font-mono text-sm bg-white text-slate-800"
        placeholder="https://example.com/&#10;https://example.com/about&#10;https://example.com/contact"></textarea>
      <p class="text-xs text-slate-500" id="url-count"></p>
    </div>

    <div class="flex flex-wrap gap-2 items-center">
      <button onclick="generate()"
        class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-xl transition-colors shadow-lg shadow-blue-200 active:scale-95 transform">
        Generate Sitemap
      </button>
      <button onclick="convertEncoding()"
        class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-3 px-5 rounded-xl border border-slate-300 transition-colors active:scale-95 transform">
        %20 → +
      </button>
      <button onclick="clearAll()"
        class="bg-slate-100 hover:bg-slate-200 text-slate-500 font-semibold py-3 px-5 rounded-xl border border-slate-300 transition-colors active:scale-95 transform">
        Clear
      </button>
    </div>
  </div>

  <!-- Output Card -->
  <div id="resultArea" class="hidden">
    <div class="flex justify-between items-center mb-2">
      <label class="font-semibold text-slate-700">Generated XML</label>
      <div class="flex gap-2 items-center">
        <span id="entry-badge" class="text-xs font-medium text-blue-600 bg-blue-50 px-2 py-1 rounded-md"></span>
        <button id="copy-btn" onclick="copyOutput()"
          class="text-xs bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-1 rounded-md transition-colors">
          Copy to Clipboard
        </button>
        <button onclick="download()" id="dl-btn"
          class="text-xs bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-1 rounded-md transition-colors">
          Download sitemap.xml
        </button>
      </div>
    </div>
    <textarea id="output" readonly rows="12"
      class="w-full p-4 bg-slate-100 border border-slate-300 rounded-xl shadow-inner text-slate-800 font-mono text-sm outline-none"
      placeholder="Your sitemap XML will appear here…"></textarea>

    <div id="toast" class="hidden mt-4 p-3 bg-emerald-100 text-emerald-700 rounded-lg text-center text-sm font-medium">
      Copied to clipboard!
    </div>
  </div>
</div>

<script>
  const inputEl = document.getElementById('url-input');
  const outputEl = document.getElementById('output');
  const countEl = document.getElementById('url-count');
  const badgeEl = document.getElementById('entry-badge');
  const resultArea = document.getElementById('resultArea');

  inputEl.addEventListener('input', () => {
    const n = validUrls().length;
    countEl.textContent = n ? `${n} URL${n !== 1 ? 's' : ''} detected` : '';
  });

  function validUrls() {
    return inputEl.value.split('\n').map(l => l.trim()).filter(l => l.length > 0);
  }

  function escapeXml(url) {
    return url
      .replace(/&/g, '&amp;')
      .replace(/'/g, '&apos;')
      .replace(/"/g, '&quot;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  function today() {
    return new Date().toISOString().split('T')[0];
  }

  function convertEncoding() {
    if (!inputEl.value.trim()) return;
    inputEl.value = inputEl.value.split('\n').map(line => line.replace(/%20/g, '+')).join('\n');
    inputEl.dispatchEvent(new Event('input'));
  }

  function generate() {
    const urls = validUrls();
    if (!urls.length) {
      resultArea.classList.remove('hidden');
      outputEl.value = '';
      outputEl.placeholder = 'No URLs found — paste at least one URL above.';
      badgeEl.textContent = '';
      return;
    }

    const date = today();
    const entries = urls.map(url => `  <url>
    <loc>${escapeXml(url)}</loc>
    <lastmod>${date}</lastmod>
    <changefreq>daily</changefreq>
    <priority>1.0</priority>
  </url>`).join('\n');

    const xml =
`<?xml version="1.0" encoding="utf-8"?>
<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
${entries}
</urlset>`;

    outputEl.value = xml;
    badgeEl.textContent = `${urls.length} URL${urls.length !== 1 ? 's' : ''}`;
    resultArea.classList.remove('hidden');
    resultArea.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function copyOutput() {
    if (!outputEl.value) return;
    navigator.clipboard.writeText(outputEl.value).then(() => {
      const toast = document.getElementById('toast');
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 2000);
    });
  }

  function download() {
    if (!outputEl.value) return;
    const blob = new Blob([outputEl.value], { type: 'application/xml' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'sitemap.xml';
    a.click();
    URL.revokeObjectURL(a.href);
  }

  function clearAll() {
    inputEl.value = '';
    outputEl.value = '';
    countEl.textContent = '';
    badgeEl.textContent = '';
    resultArea.classList.add('hidden');
  }
</script>
</body>
</html>
