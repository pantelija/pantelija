<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>XML Sitemap Generator</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
      min-height: 100vh;
      padding: 40px 20px;
    }

    .container {
      max-width: 860px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 36px;
    }

    header h1 {
      font-size: 1.7rem;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: -0.5px;
    }

    header p {
      margin-top: 6px;
      font-size: 0.9rem;
      color: #64748b;
    }

    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }

    label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #64748b;
      margin-bottom: 10px;
    }

    textarea {
      width: 100%;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      color: #1e293b;
      font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
      font-size: 0.85rem;
      line-height: 1.6;
      padding: 14px 16px;
      resize: vertical;
      transition: border-color 0.2s;
      outline: none;
    }

    textarea:focus {
      border-color: #6366f1;
      background: #fff;
    }

    textarea::placeholder {
      color: #94a3b8;
    }

    #url-input { min-height: 160px; }
    #output    { min-height: 260px; color: #166534; background: #f0fdf4; border-color: #bbf7d0; }

    .toolbar {
      display: flex;
      gap: 10px;
      margin-top: 16px;
      flex-wrap: wrap;
      align-items: center;
    }

    button {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s, background 0.15s;
    }

    button:active { transform: scale(0.97); }

    .btn-primary {
      background: #6366f1;
      color: #fff;
    }
    .btn-primary:hover { background: #4f46e5; }

    .btn-secondary {
      background: #f1f5f9;
      color: #475569;
      border: 1px solid #e2e8f0;
    }
    .btn-secondary:hover { background: #e2e8f0; }

    .btn-encode {
      background: #eff6ff;
      color: #1d4ed8;
      border: 1px solid #bfdbfe;
    }
    .btn-encode:hover { background: #dbeafe; }

    .btn-copy {
      background: #f0fdf4;
      color: #15803d;
      border: 1px solid #86efac;
    }
    .btn-copy:hover { background: #dcfce7; }
    .btn-copy.copied {
      background: #dcfce7;
      color: #166534;
    }

    .stat {
      margin-left: auto;
      font-size: 0.8rem;
      color: #94a3b8;
    }

    .output-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .badge {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      color: #1d4ed8;
      border-radius: 6px;
      padding: 3px 10px;
      font-size: 0.75rem;
      font-weight: 600;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>🗺 XML Sitemap Generator</h1>
    <p>Paste one URL per line — get a ready-to-use sitemap.xml</p>
  </header>

  <div class="card">
    <label for="url-input">URLs — one per line</label>
    <textarea id="url-input" placeholder="https://example.com/&#10;https://example.com/about&#10;https://example.com/contact"></textarea>
    <div class="toolbar">
      <button class="btn-primary" onclick="generate()">
        ⚡ Generate Sitemap
      </button>
      <button class="btn-encode" onclick="convertEncoding()" title="Replace %20 with + in all URLs">
        🔄 %20 → +
      </button>
      <button class="btn-secondary" onclick="clearAll()">
        ✕ Clear
      </button>
      <span class="stat" id="url-count"></span>
    </div>
  </div>

  <div class="card">
    <div class="output-header">
      <label style="margin-bottom:0">Generated XML</label>
      <span class="badge" id="entry-badge" style="display:none"></span>
    </div>
    <textarea id="output" readonly placeholder="Your sitemap XML will appear here…"></textarea>
    <div class="toolbar">
      <button class="btn-copy" id="copy-btn" onclick="copyOutput()" disabled>
        📋 Copy to Clipboard
      </button>
      <button class="btn-secondary" onclick="download()" id="dl-btn" disabled>
        ⬇ Download sitemap.xml
      </button>
    </div>
  </div>
</div>

<script>
  const inputEl  = document.getElementById('url-input');
  const outputEl = document.getElementById('output');
  const countEl  = document.getElementById('url-count');
  const badgeEl  = document.getElementById('entry-badge');
  const copyBtn  = document.getElementById('copy-btn');
  const dlBtn    = document.getElementById('dl-btn');

  inputEl.addEventListener('input', () => {
    const n = validUrls().length;
    countEl.textContent = n ? `${n} URL${n !== 1 ? 's' : ''} detected` : '';
  });

  function validUrls() {
    return inputEl.value
      .split('\n')
      .map(l => l.trim())
      .filter(l => l.length > 0);
  }

  function escapeXml(url) {
    return url
      .replace(/&/g, '&amp;')
      .replace(/'/g, '&apos;')
      .replace(/"/g, '&quot;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  function today() {
    return new Date().toISOString().split('T')[0];
  }

  function convertEncoding() {
    if (!inputEl.value.trim()) return;
    // Replace %20 with + only in query strings (after ?) to be safe;
    // but since user asked for a simple global replace, do it everywhere in the URL
    inputEl.value = inputEl.value
      .split('\n')
      .map(line => line.replace(/%20/g, '+'))
      .join('\n');
    // Trigger counter update
    inputEl.dispatchEvent(new Event('input'));
  }

  function generate() {
    const urls = validUrls();
    if (!urls.length) {
      outputEl.value = '';
      outputEl.placeholder = 'No URLs found — paste at least one URL above.';
      setDisabled(true);
      badgeEl.style.display = 'none';
      return;
    }

    const date = today();
    const entries = urls.map(url => `  <url>
    <loc>${escapeXml(url)}</loc>
    <lastmod>${date}</lastmod>
    <changefreq>daily</changefreq>
    <priority>1.0</priority>
  </url>`).join('\n');

    const xml =
`<?xml version="1.0" encoding="utf-8"?>
<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
${entries}
</urlset>`;

    outputEl.value = xml;
    badgeEl.textContent = `${urls.length} URL${urls.length !== 1 ? 's' : ''}`;
    badgeEl.style.display = 'inline';
    setDisabled(false);
  }

  function setDisabled(state) {
    copyBtn.disabled = state;
    dlBtn.disabled   = state;
  }

  function copyOutput() {
    if (!outputEl.value) return;
    navigator.clipboard.writeText(outputEl.value).then(() => {
      copyBtn.textContent = '✓ Copied!';
      copyBtn.classList.add('copied');
      setTimeout(() => {
        copyBtn.innerHTML = '📋 Copy to Clipboard';
        copyBtn.classList.remove('copied');
      }, 2000);
    });
  }

  function download() {
    if (!outputEl.value) return;
    const blob = new Blob([outputEl.value], { type: 'application/xml' });
    const a    = document.createElement('a');
    a.href     = URL.createObjectURL(blob);
    a.download = 'sitemap.xml';
    a.click();
    URL.revokeObjectURL(a.href);
  }

  function clearAll() {
    inputEl.value  = '';
    outputEl.value = '';
    countEl.textContent = '';
    badgeEl.style.display = 'none';
    setDisabled(true);
  }
</script>
</body>
</html>
