<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wellness Protocol Matchmaker</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* Custom Animations */
        @keyframes fade-in-up {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fade-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .animate-fade-in-up { animation: fade-in-up 0.6s ease-out forwards; }
        .animate-fade-in { animation: fade-in 0.4s ease-out forwards; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- ICONS (Inlined for standalone usage) ---
        const IconWrapper = ({ children, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                {children}
            </svg>
        );

        const Activity = (props) => <IconWrapper {...props}><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></IconWrapper>;
        const Moon = (props) => <IconWrapper {...props}><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></IconWrapper>;
        const Zap = (props) => <IconWrapper {...props}><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></IconWrapper>;
        const Users = (props) => <IconWrapper {...props}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></IconWrapper>;
        const ArrowRight = (props) => <IconWrapper {...props}><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></IconWrapper>;
        const Thermometer = (props) => <IconWrapper {...props}><path d="M14 4v10.54a4 4 0 1 1-4 0V4a2 2 0 0 1 4 0Z"/></IconWrapper>;
        const Timer = (props) => <IconWrapper {...props}><line x1="10" x2="14" y1="2" y2="2"/><line x1="12" x2="15" y1="14" y2="11"/><circle cx="12" cy="14" r="8"/></IconWrapper>;
        const Droplets = (props) => <IconWrapper {...props}><path d="M7 16.3c2.2 0 4-1.83 4-4.05 0-1.16-.57-2.26-1.71-3.19S7.29 6.75 7 5.3c-.29 1.45-1.14 2.8-2.29 3.76S3 11.1 3 12.25c0 2.22 1.8 4.05 4 4.05z"/><path d="M12.56 6.6A10.97 10.97 0 0 0 14 3.02c.5 2.5 2 4.9 4 6.5s3 3.5 3 5.5a6.98 6.98 0 0 1-11.91 4.35"/></IconWrapper>;
        const CheckCircle2 = (props) => <IconWrapper {...props}><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></IconWrapper>;
        const ChevronRight = (props) => <IconWrapper {...props}><path d="m9 18 6-6-6-6"/></IconWrapper>;
        const RefreshCw = (props) => <IconWrapper {...props}><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></IconWrapper>;
        const Home = (props) => <IconWrapper {...props}><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></IconWrapper>;
        const Wind = (props) => <IconWrapper {...props}><path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2"/><path d="M9.6 4.6A2 2 0 1 1 11 8H2"/><path d="M12.6 19.4A2 2 0 1 0 14 16H2"/></IconWrapper>;

        // --- DATA & LOGIC ---

        const QUESTIONS = [
            {
                id: 'goal',
                title: "What is your primary wellness barrier?",
                subtitle: "We'll tailor the protocol to solve this specific problem.",
                options: [
                    { id: 'recovery', label: "Muscle Soreness & Pain", icon: Activity, desc: "I train hard and need faster recovery." },
                    { id: 'sleep', label: "Poor Sleep & Stress", icon: Moon, desc: "I have trouble winding down or staying asleep." },
                    { id: 'energy', label: "Low Energy / Brain Fog", icon: Zap, desc: "I need a metabolic boost and mental clarity." },
                    { id: 'social', label: "Connection & Leisure", icon: Users, desc: "I want a space to relax with family/friends." },
                ]
            },
            {
                id: 'experience',
                title: "What's your heat/cold tolerance?",
                subtitle: "This determines the intensity of your recommended routine.",
                options: [
                    { id: 'beginner', label: "Comfort Seeker", icon: Home, desc: "I prefer gentle warmth and relaxation." },
                    { id: 'intermediate', label: "Wellness Curious", icon: RefreshCw, desc: "I'm ready to push my comfort zone slightly." },
                    { id: 'advanced', label: "The Optimizer", icon: Activity, desc: "I want the most intense, results-driven experience." },
                ]
            },
            {
                id: 'space',
                title: "Where is your sanctuary located?",
                subtitle: "We need to ensure the equipment fits your environment.",
                options: [
                    { id: 'indoor', label: "Indoor / Basement", icon: Home, desc: "Limited space, needs standard doorway access." },
                    { id: 'outdoor_small', label: "Small Patio / Deck", icon: Wind, desc: "Compact outdoor footprint." },
                    { id: 'outdoor_large', label: "Large Backyard", icon: Droplets, desc: "Space is not an issue." },
                ]
            }
        ];

        const PROTOCOLS = {
            recovery: {
                title: "The Contrast Recovery Protocol",
                tagline: "Flush lactic acid and reduce inflammation.",
                description: "Alternating between intense heat and cold creates a 'pumping' action in your lymphatic system, accelerating muscle repair.",
                steps: [
                    { time: "15 Min", action: "Infrared Sauna (60°C)", benefit: "Vasodilation & sweat" },
                    { time: "2 Min", action: "Cold Plunge (10°C)", benefit: "Vasoconstriction" },
                    { time: "15 Min", action: "Infrared Sauna", benefit: "Re-stabilize core temp" },
                    { time: "End", action: "Hydrate + Stretch", benefit: "Recovery complete" }
                ],
                products: [
                    { name: "Recovery Pro Sauna", type: "Full Spectrum Infrared", price: "$4,299", image: "linear-gradient(135deg, #e2e8f0 0%, #cbd5e1 100%)" },
                    { name: "IceBarrel One", type: "Chiller Integrated", price: "$2,999", image: "linear-gradient(135deg, #bae6fd 0%, #7dd3fc 100%)" }
                ]
            },
            sleep: {
                title: "The Deep Sleep Decompression",
                tagline: "Lower cortisol and prepare for REM.",
                description: "Gentle, sustained heat before bed mimics the body's natural circadian temperature drop once you exit, signaling it's time to sleep.",
                steps: [
                    { time: "60 Min Pre-Bed", action: "No Screens / Blue Light", benefit: "Melatonin production" },
                    { time: "20 Min", action: "Hot Tub / Sauna (39°C)", benefit: "Muscle relaxation" },
                    { time: "2 Min", action: "Warm Rinse (Not Cold)", benefit: "Gradual cooling" },
                    { time: "Bed", action: "Sleep immediately", benefit: "Deep REM entry" }
                ],
                products: [
                    { name: "Glass 1989 Hybrid Sauna", type: "Low EMF Infrared", price: "$3,499", image: "url('sauna.png')" },
                    { name: "Jacuzzi® J-315", type: "4-Seater Lounger", price: "$16,999", image: "url('j325.png')" }
                ]
            },
            energy: {
                title: "The Metabolic Firestarter",
                tagline: "Spike dopamine and boost immunity.",
                description: "A cold-dominant protocol designed to shock the system, releasing norepinephrine and dopamine for sustained focus.",
                steps: [
                    { time: "Morning", action: "Breathwork (Wim Hof style)", benefit: "Oxygenation" },
                    { time: "3 Min", action: "Cold Plunge (<7°C)", benefit: "250% Dopamine Spike" },
                    { time: "Horse Stance", action: "Natural warm up", benefit: "Brown Fat Activation" },
                    { time: "Go", action: "Start your day", benefit: "Laser focus" }
                ],
                products: [
                    { name: "Chill Tubs Pro", type: "A Premium Cold Plunge", price: "$4,999", image: "url('chill.png')" }
                ]
            },
            social: {
                title: "The Social Sanctuary",
                tagline: "Connect without distraction.",
                description: "A low-intensity protocol designed for long duration usage, perfect for conversation and bonding.",
                steps: [
                    { time: "Setup", action: "Set Temp to 38°C", benefit: "Safe for long soaks" },
                    { time: "45 Min", action: "Hydrotherapy Cycle", benefit: "Stress reduction" },
                    { time: "Break", action: "Hydration Break", benefit: "Prevent dehydration" },
                    { time: "Repeat", action: "As desired", benefit: "Quality time" }
                ],
                products: [
                    { name: "Grand Entertainer", type: "7-Seat Hot Tub", price: "$11,499", image: "linear-gradient(135deg, #c7d2fe 0%, #a5b4fc 100%)" }
                ]
            }
        };

        // --- COMPONENTS ---

        const Card = ({ children, className = "" }) => (
            <div className={`bg-white border border-slate-200 rounded-xl overflow-hidden shadow-xl ${className}`}>
                {children}
            </div>
        );

        const Button = ({ children, onClick, variant = "primary", className = "" }) => {
            const baseStyle = "px-6 py-3 rounded-lg font-semibold transition-all duration-200 transform active:scale-95 flex items-center justify-center gap-2";
            const variants = {
                primary: "bg-blue-600 hover:bg-blue-700 text-white shadow-lg shadow-blue-200",
                secondary: "bg-slate-100 hover:bg-slate-200 text-slate-900",
                outline: "border border-slate-300 hover:border-slate-400 text-slate-600 hover:text-slate-900 bg-white"
            };
            return (
                <button onClick={onClick} className={`${baseStyle} ${variants[variant]} ${className}`}>
                    {children}
                </button>
            );
        };

        // --- MAIN APP COMPONENT ---

        function ProtocolMatchmaker() {
            const [step, setStep] = useState('welcome');
            const [currentQuestionIndex, setCurrentQuestionIndex] = useState(0);
            const [answers, setAnswers] = useState({});
            const [loadingProgress, setLoadingProgress] = useState(0);

            const handleAnswer = (optionId) => {
                const currentQ = QUESTIONS[currentQuestionIndex];
                setAnswers(prev => ({ ...prev, [currentQ.id]: optionId }));

                if (currentQuestionIndex < QUESTIONS.length - 1) {
                    setCurrentQuestionIndex(prev => prev + 1);
                } else {
                    setStep('analyzing');
                }
            };

            useEffect(() => {
                if (step === 'analyzing') {
                    const interval = setInterval(() => {
                        setLoadingProgress(prev => {
                            if (prev >= 100) {
                                clearInterval(interval);
                                setStep('results');
                                return 100;
                            }
                            return prev + 2;
                        });
                    }, 30);
                    return () => clearInterval(interval);
                }
            }, [step]);

            const resetQuiz = () => {
                setStep('welcome');
                setCurrentQuestionIndex(0);
                setAnswers({});
                setLoadingProgress(0);
            };

            if (step === 'welcome') {
                return (
                    <div className="min-h-screen bg-slate-50 text-slate-900 flex flex-col items-center justify-center p-6 relative overflow-hidden">
                        <div className="absolute top-0 left-0 w-full h-full overflow-hidden z-0 opacity-40 pointer-events-none">
                            <div className="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] bg-blue-200 rounded-full blur-[120px]"></div>
                            <div className="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] bg-orange-200 rounded-full blur-[120px]"></div>
                        </div>

                        <div className="z-10 max-w-2xl text-center space-y-8 animate-fade-in-up">
                            
                            {/* LOGO ADDED HERE */}
                            <img src="https://www.progibespa.es/wp-content/uploads/progibespa-typo-logo.png" alt="ProgibeSPA" className="w-[250px] mx-auto" />

                            <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-white border border-slate-200 text-xs font-medium text-slate-500 uppercase tracking-widest mb-4 shadow-sm">
                                ProgibeSPA Wellness Engine
                            </div>
                            <h1 className="text-5xl md:text-7xl font-bold tracking-tight text-slate-900">
                                Stop Guessing. <br />
                                <span className="text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-orange-500">Start Optimizing.</span>
                            </h1>
                            <p className="text-xl text-slate-600 max-w-lg mx-auto leading-relaxed">
                                Wellness isn't one-size-fits-all. Take our 60-second assessment to generate your personalized 
                                Bio-Optimization Protocol and equipment prescription.
                            </p>
                            
                            <div className="flex flex-col sm:flex-row gap-4 justify-center pt-8">
                                <Button onClick={() => setStep('quiz')} className="w-full sm:w-auto text-lg px-12 py-4">
                                    Find My Protocol <ArrowRight className="w-5 h-5" />
                                </Button>
                            </div>
                            
                            <div className="pt-12 flex justify-center gap-8 text-slate-500 text-sm">
                                <div className="flex items-center gap-2"><CheckCircle2 className="w-4 h-4 text-green-600" /> Science Backed</div>
                                <div className="flex items-center gap-2"><CheckCircle2 className="w-4 h-4 text-green-600" /> Free Analysis</div>
                                <div className="flex items-center gap-2"><CheckCircle2 className="w-4 h-4 text-green-600" /> Instant Results</div>
                            </div>
                        </div>
                    </div>
                );
            }

            if (step === 'quiz') {
                const question = QUESTIONS[currentQuestionIndex];
                return (
                    <div className="min-h-screen bg-slate-50 text-slate-900 flex flex-col p-6">
                        <div className="max-w-2xl mx-auto w-full flex-1 flex flex-col justify-center">
                            <div className="w-full bg-slate-200 h-2 rounded-full mb-12 overflow-hidden">
                                <div 
                                    className="bg-blue-600 h-full transition-all duration-500 ease-out"
                                    style={{ width: `${((currentQuestionIndex + 1) / QUESTIONS.length) * 100}%` }}
                                ></div>
                            </div>

                            <div className="space-y-2 mb-8 animate-fade-in">
                                <h2 className="text-3xl font-bold text-slate-900">{question.title}</h2>
                                <p className="text-slate-500">{question.subtitle}</p>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                {question.options.map((option) => {
                                    const Icon = option.icon;
                                    return (
                                        <button
                                            key={option.id}
                                            onClick={() => handleAnswer(option.id)}
                                            className="group relative p-6 bg-white border border-slate-200 rounded-xl hover:border-blue-500 hover:shadow-lg hover:shadow-blue-500/10 transition-all duration-300 text-left flex flex-col gap-4 shadow-sm"
                                        >
                                            <div className="w-12 h-12 rounded-lg bg-slate-100 group-hover:bg-blue-50 text-slate-500 group-hover:text-blue-600 transition-colors flex items-center justify-center">
                                                <Icon className="w-6 h-6" />
                                            </div>
                                            <div>
                                                <h3 className="font-semibold text-lg mb-1 text-slate-900">{option.label}</h3>
                                                <p className="text-sm text-slate-500 leading-snug">{option.desc}</p>
                                            </div>
                                            <div className="absolute top-6 right-6 opacity-0 group-hover:opacity-100 transition-opacity">
                                                <ArrowRight className="w-5 h-5 text-blue-500" />
                                            </div>
                                        </button>
                                    );
                                })}
                            </div>
                        </div>
                    </div>
                );
            }

            if (step === 'analyzing') {
                return (
                    <div className="min-h-screen bg-slate-50 text-slate-900 flex flex-col items-center justify-center p-6">
                        <div className="w-full max-w-md space-y-8 text-center">
                            <div className="relative w-32 h-32 mx-auto">
                                <div className="absolute inset-0 border-4 border-slate-200 rounded-full"></div>
                                <div 
                                    className="absolute inset-0 border-4 border-t-blue-500 border-r-blue-500 border-b-transparent border-l-transparent rounded-full animate-spin"
                                    style={{ transform: `rotate(${loadingProgress * 3.6}deg)`}}
                                ></div>
                                <div className="absolute inset-0 flex items-center justify-center font-bold text-2xl text-slate-900">
                                    {loadingProgress}%
                                </div>
                            </div>
                            <div className="space-y-2">
                                <h2 className="text-2xl font-bold animate-pulse text-slate-900">Analyzing Biometrics...</h2>
                                <p className="text-slate-500">Matching goals with clinical protocols</p>
                            </div>
                            <div className="flex flex-col gap-2 max-w-xs mx-auto text-sm text-slate-600">
                                <div className={`flex items-center gap-2 transition-opacity duration-300 ${loadingProgress > 20 ? 'opacity-100 text-blue-600' : 'opacity-30'}`}>
                                    <CheckCircle2 className="w-4 h-4" /> Evaluating Space Constraints
                                </div>
                                <div className={`flex items-center gap-2 transition-opacity duration-300 ${loadingProgress > 50 ? 'opacity-100 text-blue-600' : 'opacity-30'}`}>
                                    <CheckCircle2 className="w-4 h-4" /> Calculating Thermal Load
                                </div>
                                <div className={`flex items-center gap-2 transition-opacity duration-300 ${loadingProgress > 80 ? 'opacity-100 text-blue-600' : 'opacity-30'}`}>
                                    <CheckCircle2 className="w-4 h-4" /> Generating Prescription
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            const result = PROTOCOLS[answers.goal] || PROTOCOLS.recovery;
            
            return (
                <div className="min-h-screen bg-slate-50 text-slate-900 overflow-x-hidden">
                    
                    <nav className="w-full bg-white/80 backdrop-blur-md border-b border-slate-200 p-4 sticky top-0 z-50 flex justify-between items-center shadow-sm">
                        <div className="font-bold tracking-widest uppercase text-sm flex items-center gap-2 text-slate-900">
                            <Activity className="w-5 h-5 text-blue-600" /> Protocol Results
                        </div>
                        <button onClick={resetQuiz} className="text-xs text-slate-500 hover:text-blue-600 underline">
                            Retake Assessment
                        </button>
                    </nav>

                    <div className="max-w-5xl mx-auto p-4 md:p-8 space-y-12 pb-24">
                        
                        <section className="space-y-6 animate-fade-in-up">
                            <div className="inline-block px-4 py-1 rounded-full bg-blue-50 border border-blue-100 text-blue-600 text-sm font-semibold mb-2">
                                Recommended Protocol
                            </div>
                            <h1 className="text-4xl md:text-5xl font-bold leading-tight text-slate-900">{result.title}</h1>
                            <p className="text-xl text-slate-600 max-w-3xl">{result.description}</p>
                        </section>

                        <section>
                            <div className="flex items-center gap-3 mb-6">
                                <Timer className="w-6 h-6 text-orange-500" />
                                <h2 className="text-2xl font-bold text-slate-900">Your Daily Routine</h2>
                            </div>
                            
                            <div className="grid gap-4 md:grid-cols-4">
                                {result.steps.map((step, idx) => (
                                    <div key={idx} className="relative group">
                                        <div className="bg-white border border-slate-200 rounded-xl p-6 h-full hover:border-blue-400 hover:shadow-md transition-all duration-300 shadow-sm">
                                            <div className="text-blue-600 font-bold text-lg mb-2">{step.time}</div>
                                            <div className="text-slate-900 font-semibold mb-1">{step.action}</div>
                                            <div className="text-slate-500 text-sm">{step.benefit}</div>
                                        </div>
                                        {idx !== result.steps.length - 1 && (
                                            <div className="hidden md:block absolute top-1/2 right-0 transform translate-x-1/2 -translate-y-1/2 z-10 text-slate-300">
                                                <ChevronRight className="w-6 h-6" />
                                            </div>
                                        )}
                                    </div>
                                ))}
                            </div>
                        </section>

                        <section>
                            <div className="flex items-center gap-3 mb-6">
                                <Thermometer className="w-6 h-6 text-blue-600" />
                                <h2 className="text-2xl font-bold text-slate-900">Prescribed Equipment</h2>
                            </div>
                            
                            <div className="grid md:grid-cols-2 gap-8">
                                {result.products.map((product, idx) => (
                                    <Card key={idx} className="group">
                                        <div 
                                            className="h-64 w-full relative bg-cover bg-center"
                                            style={{ background: product.image }}
                                        >
                                            <div className="absolute inset-0 bg-white/10 group-hover:bg-transparent transition-colors duration-500"></div>
                                            <div className="absolute bottom-4 left-4">
                                                <span className="bg-white/90 backdrop-blur-md text-slate-900 px-3 py-1 rounded-md text-xs font-bold uppercase tracking-wider shadow-sm">
                                                    Best Match
                                                </span>
                                            </div>
                                        </div>
                                        
                                        <div className="p-6">
                                            <div className="flex justify-between items-start mb-2">
                                                <div>
                                                    <p className="text-slate-500 text-sm mb-1">{product.type}</p>
                                                    <h3 className="text-2xl font-bold text-slate-900">{product.name}</h3>
                                                </div>
                                                <div className="text-xl font-semibold text-blue-600">{product.price}</div>
                                            </div>
                                            
                                            <div className="mt-6 flex gap-3">
                                                <Button className="flex-1">Configure & Buy</Button>
                                                <Button variant="secondary">View Specs</Button>
                                            </div>
                                        </div>
                                    </Card>
                                ))}
                            </div>
                        </section>

                        <section className="bg-slate-100 rounded-2xl p-8 border border-slate-200">
                            <h3 className="text-xl font-bold mb-4 text-slate-900">Why we prescribed this for you</h3>
                            <p className="text-slate-600 leading-relaxed mb-6">
                                Based on your goal of <strong>{QUESTIONS[0].options.find(o => o.id === answers.goal)?.label}</strong> and your 
                                <strong> {QUESTIONS[2].options.find(o => o.id === answers.space)?.label}</strong> environment, this specific combination optimizes your physiological response.
                                We selected equipment that fits your experience level ({QUESTIONS[1].options.find(o => o.id === answers.experience)?.label}) to ensure adherence to the protocol.
                            </p>
                            <div className="flex flex-wrap gap-3">
                                <span className="px-3 py-1 rounded-full bg-white text-slate-600 text-xs border border-slate-200 font-medium shadow-sm">Cortisol Reduction</span>
                                <span className="px-3 py-1 rounded-full bg-white text-slate-600 text-xs border border-slate-200 font-medium shadow-sm">Vasodilation</span>
                                <span className="px-3 py-1 rounded-full bg-white text-slate-600 text-xs border border-slate-200 font-medium shadow-sm">HSP Activation</span>
                            </div>
                        </section>

                        <div className="text-center pt-8">
                            <p className="text-slate-500 text-sm mb-4">Want to save this protocol?</p>
                            <Button variant="outline" className="mx-auto">
                                Email Me My Protocol
                            </Button>
                        </div>

                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ProtocolMatchmaker />);
    </script>
</body>
</html>
